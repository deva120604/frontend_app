<app-sidebar></app-sidebar>

<div class="content">

<h2>Transactions</h2>

<a routerLink="/dashboard">Back to Dashboard</a>

<br><br>

<table border="1" cellpadding="10">

<tr>
<th>Transaction ID</th>
<th>User</th>
<th>Amount</th>
<th>Status</th>
</tr>

<tr *ngFor="let t of transactions">
<td>{{t.id}}</td>
<td>{{t.user}}</td>
<td>{{t.amount}}</td>
<td>{{t.status}}</td>
</tr>

</table>

</div>
