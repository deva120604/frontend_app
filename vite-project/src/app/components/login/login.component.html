<div class="login-container">
  <h2>Login</h2>

  <input
    type="email"
    placeholder="Email"
    [(ngModel)]="email"
  />

  <input
    type="password"
    placeholder="Password"
    [(ngModel)]="password"
  />

  <button (click)="onLogin()">Login</button>
  <p>Don't have account? 
  <a routerLink="/register">Register here</a>
</p>

</div>
